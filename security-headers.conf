# Stricter security-headers drop-in for Apache 2.4.
#
# Usage: Include this file inside your <VirtualHost *:443> block, or merge
# its directives into your vhost config:
#
#     Include /etc/apache2/conf-available/security-headers.conf
#
# Requires: a2enmod headers
#
# Notes:
#   * The Content-Security-Policy line is commented out on purpose: CSP must
#     be tuned per site (plugins, embeds, analytics all add sources). Start
#     with Content-Security-Policy-Report-Only, watch the violation reports,
#     then switch to the enforcing header.
#   * "Header unset Server" does NOT reliably remove the Server banner on
#     stock Apache — set "ServerTokens Prod" and "ServerSignature Off" in
#     /etc/apache2/conf-enabled/security.conf instead.

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"

    # CSP: report-only first, enforce only after tuning.
    # Header always set Content-Security-Policy-Report-Only "default-src 'self' https:; img-src 'self' https: data:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:;"

    # Two-year HSTS with preload (only after HTTPS is verified everywhere)
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
</IfModule>
