# Apache 2.4 VirtualHost for WordPress (HTTP + HTTPS, PHP-FPM)
#
# 1. Copy to /etc/apache2/sites-available/example.com.conf
# 2. Replace every "example.com" and the /var/www/example.com paths
# 3. a2enmod ssl rewrite headers expires deflate proxy proxy_fcgi
#    a2ensite example.com && apachectl configtest && systemctl reload apache2
#
# Certificates below come from Certbot:
#   certbot --apache -d example.com -d www.example.com

<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com

    # Everything to HTTPS, keeping the path
    Redirect permanent / https://example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com
    DocumentRoot /var/www/example.com/public_html

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/example.com/privkey.pem

    # TLS 1.2+ only, sane cipher order
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     on
    SSLCompression          off
    SSLSessionTickets       off

    <Directory /var/www/example.com/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- PHP-FPM over a Unix socket (adjust the PHP version) ---
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # --- Block sensitive files ---
    # xmlrpc.php is blocked for hardening; comment out the xmlrpc.php part
    # if you rely on Jetpack or the WordPress mobile app.
    <FilesMatch "^(wp-config\.php|xmlrpc\.php|\.htaccess|\.user\.ini|debug\.log)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.(sql|bak|old|orig|swp|dist)$">
        Require all denied
    </FilesMatch>
    RedirectMatch 404 /\.git
    RedirectMatch 404 /\.env

    # --- Browser caching for static assets ---
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpeg       "access plus 1 year"
        ExpiresByType image/png        "access plus 1 year"
        ExpiresByType image/webp       "access plus 1 year"
        ExpiresByType image/svg+xml    "access plus 1 year"
        ExpiresByType image/x-icon     "access plus 1 year"
        ExpiresByType font/woff2       "access plus 1 year"
        ExpiresByType text/css         "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType text/html        "access plus 0 seconds"
    </IfModule>

    # --- Compression ---
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css \
            application/javascript application/json application/xml \
            image/svg+xml font/woff2
    </IfModule>

    # --- Security headers (needs mod_headers) ---
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        # HSTS: enable only once you are sure HTTPS works everywhere.
        # Add "; preload" after submitting to hstspreload.org.
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>

    # --- Logging ---
    ErrorLog  ${APACHE_LOG_DIR}/example.com-error.log
    CustomLog ${APACHE_LOG_DIR}/example.com-access.log combined
</VirtualHost>
